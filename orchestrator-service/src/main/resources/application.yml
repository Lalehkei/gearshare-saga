server:
  port: 8085

spring:
  application:
    name: orchestrator-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/orchestrator_db
    username: gearshare
    password: gearshare
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: orchestrator-service
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.gearshare.events.*"
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# See SagaTimeoutSweeper's javadoc for why this is longer than approval-service's own
# approval.timeout-seconds (60s) -- it's a backstop for a completely unresponsive
# approval-service, not the normal "owner didn't answer" path.
orchestrator:
  saga-timeout-seconds: 90
  sweep-interval-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.gearshare: INFO
